# Live virus antiviral screening assay protocols

- id: SARS-CoV-2_HeLa-ACE2_antiviral
  permalink: http://asapdiscovery.org/outputs/antiviral-protocols/#SARS-CoV-2_HeLa-ACE2_antiviral
  name: Live Virus SARS-CoV-2 - HeLa-ACE2 - Antiviral Screening Assay
  description: |
    Protocol for live virus antiviral screening against SARS-CoV-2 in vitro. Cells are prophylactically treated with antiviral candidates that have been serially diluted. IC50 values are generated via immunofluorescent staining analysis. Each live virus screening assay is accompanied by a matching cytotoxicity screening assay.
  links:
  - name: protocol
    url: https://www.protocols.io/view/live-virus-sars-cov-2-hela-ace2-antiviral-screenin-yxmvmee4ng3p/v1
  type: antiviral-assay-protocol
  cores: [Antiviral Assay Core]
  events:
  - date: 2025-03-18
    description: v1

