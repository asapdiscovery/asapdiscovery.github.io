TEP:
  # Name of the TEP
  name: Dengue NS5 RNA-dependent RNA polymerase
  asap:
    # Viral family is one of ['coronaviridae', 'flaviviridae', 'picornaviridae', 'togaviridae', 'orthomyxoviridae']
    viral_family: flaviviridae
    viruses:
    - Dengue
    # ASAP program codename. From this list:
    # https://www.notion.so/asapdiscovery/Data-Core-11bd0c209eb44c409e532f00edf3f060?pvs=4#388f41b3676749889930c0898e04b89c
    program_code: ASAPPIBTTB
    program_nickname: ASAP-DENV-NS5-RDRP
  # Target nominator
  nominator: Karla Kirkegaard
  # Lead investigator at Diamond
  investigator: Frank von Delft
  # Therapeutic area
  therapeutic_area: Infectious diseases
  # Disease relevance statement
  disease_relevance: NS5 encodes an RNA-dependent RNA polymerase
  # TODO: This should be pulled from the reported research products instead, and possibly renamed to "contributors"
  contributors:
  - Lizbé Koekemoer
  resources:
      - name: "Fragalysis interactive view of the OpenBind/ASAP crystallographic dataset for flavivirus NS5 RNA-dependent RNA polymerase"
        id: flade-NS5B-polymerase_openbind-fragalysis
        date: 2026-05-05
        type: xray-fragment-screen
        url: https://fragalysis.diamond.ac.uk/viewer/react/preview/target/Flavi_NS5_RdRp/tas/lb42888-6
        projects: [Project 2]
        cores: [Structural Biology Core]
        description: |
          315 crystallographic binding events across DENV-2 and ZIKV NS5 RNA-dependent RNA polymerase, released by the OpenBind Consortium as joint OpenBind/ASAP work.

          Bulk download of the full dataset: [Fragalysis download](https://fragalysis.diamond.ac.uk/viewer/react/download/tag/a1bb1125-a271-4069-8aee-6cfdcd621c72)
