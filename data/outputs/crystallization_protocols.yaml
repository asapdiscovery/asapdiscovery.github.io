- id: SARS-CoV-2_nsp3-mac_P1211_crystallization
  permalink: http://asapdiscovery.org/outputs/crystallization-protocols/#SARS-CoV-2_nsp3-mac_P1211_crystallization
  name: Crystallisation protocol for SARS-CoV-2 nsp3 macrodomain in P1 21 1
  description: |
    This protocol details an optimized crystallization method for the SARS-CoV-2 nsp3 macrodomain. Using sitting drop vapor diffusion with seeding, it yields crystals that diffract to an average resolution of 1.5 Å, enabling high-resolution structural studies for compound development.
