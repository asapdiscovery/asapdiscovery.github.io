- id: SARS-CoV-2_nsp15_crystallization
  permalink: http://asapdiscovery.org/outputs/crystallization-protocols/#SARS-CoV-2_nsp15_crystallization
  name: Crystallization of SARS-CoV-2 nsp15 NendoU
  description: |
    The NSP15 endoribonuclease enzyme, known as NendoU, is highly conserved and plays a critical role in the ability of the virus to evade the immune system. NendoU is a promising target for the development of new antiviral drugs. This protocol was used to grow SARS CoV-2 NSP15 crystals for XChem fragment screening.
