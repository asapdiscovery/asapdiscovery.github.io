- id: MERS-CoV_Mpro_crystallization
  permalink: http://asapdiscovery.org/outputs/crystallization-protocols/#MERS-CoV_Mpro_crystallization
  name: Crystallisation of MERS-CoV Mpro
  description: |
    MERS-CoV is a zoonotic virus that was first discovered in 2012. The disease has spread rapidly with large outbreaks as recent as 2015 and 2018. Currently there is no therapeutic intervention for MERS-CoV with 35% of reported cases resulting in human death. This protocol details crystallization conditions for MERS-CoV Mpro suitable for XChem fragment screening.
