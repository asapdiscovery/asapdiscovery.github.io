# Biophysical assay and ADMET protocols

# Grating-coupled interferometry (Creoptix) protocols
- id: Creoptix_immobilization
  permalink: http://asapdiscovery.org/outputs/biophysical-protocols/#Creoptix_immobilization
  name: "Creoptix Protein Immobilization Protocol: His-tag Capture via EDC/NHS chemistry"
  description: |
    Comprehensive method for immobilizing His-tagged proteins on a PCH-NTA chip using the Creoptix WAVEsystem. Includes chip conditioning, protein capture, and covalent immobilization through His capture and EDC/NHS chemistry.
