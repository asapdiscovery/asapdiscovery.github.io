# ADMET protocols
- id: solubility_shake_flask
  permalink: http://asapdiscovery.org/outputs/biophysical-protocols/#solubility_shake_flask
  name: Shake-Flask Aqueous Solubility assay (Kinetic solubility)
  description: |
    Kinetic solubility method for early-stage drug discovery. Solid compounds dissolved in DMSO are added to aqueous buffer and observed for precipitate formation. Concentration measured by UV or LC-MS/MS.
