  - name: fitness view, EV-A71 DMS
    url: /fitness-views/ev-2a-protease-eva71-dms.html
  - name: "source data: NextStrain EV-D68"
    url: https://nextstrain.org/enterovirus/d68/genome
  - name: "source data: NextStrain EV-A71"
    url: https://nextstrain.org/groups/hodcroftlab/enterovirus/A71/whole-genome
  - name: "source data: EV-A71 proteome-wide DMS (Bakhache et al. 2024)"
    url: https://doi.org/10.1038/s41564-024-01871-y
  projects: [Project 1, Computational Chemistry Core]
  events:
  - date: 2026-10-31
    description: Initial version of analyzed data posted to website

