name: rppr
channels:
  - conda-forge
dependencies:
  - python
  - python-docx
  - docxcompose
  - mistune<1.0
  - sympy
  - pyyaml
  - pandas
  - openpyxl
  - requests
  - pypdf
  - ghostscript  # flattens/compresses PDFs for eRA upload
  - pip
  - pip:
      - docx2pdf  # PDF rendering via Microsoft Word when LibreOffice is not installed
